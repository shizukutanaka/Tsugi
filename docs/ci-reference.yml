# Tsugi CI 参照定義（tracked source of truth）
#
# 注意: 実体の `.github/workflows/ci.yml` は `.gitignore` で除外されている
# （この環境の GitHub App に workflows 権限が無く push 不可・CONTRIBUTING 参照）。
# そのため CI 定義はこのファイルを正本として追跡し、リポジトリ管理者が GitHub UI で
# `.github/workflows/ci.yml` に反映する。ローカル代替は `run.py` + `verify.py`。
#
# ローカル検証と CI の lint 範囲・実行対象は一致させること（python/ verify.py tests/ examples/、
# 加えて examples のスモーク実行）。差があると CI 緑がローカル失敗を見逃す。
name: ci
on: [push, pull_request]

jobs:
  python-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check python/ verify.py tests/ examples/
      - name: Correctness harness (skips GPU — honest)
        run: python tests/correctness/run.py
      - name: Verify invariants
        run: python verify.py
      - name: Examples smoke (user-facing entrypoints must run)
        run: |
          for ex in examples/matmul.py examples/user_kernel.py examples/audit_demo.py; do
            echo "--- $ex ---"; PYTHONPATH=python python "$ex" >/dev/null
          done

  # 注: MLIR/LLVM ビルド + 実GPU correctness は self-hosted runner が必要。
  # CPU-only の GitHub runner では dialect の round-trip 検証に留まる。
  # mlir-build:
  #   runs-on: [self-hosted, gpu]   # 実機接続後に有効化

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM (syft)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft dir:. -o spdx-json=sbom.spdx.json || echo "syft optional"
