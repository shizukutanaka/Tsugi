# Tsugi CI 参照定義（tracked source of truth）
#
# 注意: 実体の `.github/workflows/ci.yml` は `.gitignore` で除外されている
# （この環境の GitHub App に workflows 権限が無く push 不可・CONTRIBUTING 参照）。
# そのため CI 定義はこのファイルを正本として追跡し、リポジトリ管理者が GitHub UI で
# `.github/workflows/ci.yml` に反映する。ローカル代替は `run.py` + `verify.py`。
#
# ローカル検証と CI は `check.py` を **単一の定義** として共有する（ここでゲートを再列挙しない）。
# 以前は本ファイルと CONTRIBUTING.md にゲートが二重定義され、実際に食い違っていた
# （CONTRIBUTING は verify.py を lint 対象から落としていた）。呼ぶだけにすればドリフトは起き得ない。
name: ci
on: [push, pull_request]

jobs:
  python-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: pip install numpy ruff
      # ゲートの実体は check.py（ローカルと CI の単一定義）。ここでステップを再列挙すると
      # ドリフトが生まれる（実際に CONTRIBUTING と食い違っていた）ので呼ぶだけにする。
      - name: All gates (lint + correctness + invariants + examples smoke)
        run: python check.py

  # 注: MLIR/LLVM ビルド + 実GPU correctness は self-hosted runner が必要。
  # CPU-only の GitHub runner では dialect の round-trip 検証に留まる。
  # mlir-build:
  #   runs-on: [self-hosted, gpu]   # 実機接続後に有効化

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM (syft)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft dir:. -o spdx-json=sbom.spdx.json || echo "syft optional"
