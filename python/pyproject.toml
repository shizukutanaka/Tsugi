[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tsugi-torch"
version = "0.4.0"
description = "Tsugi torch.compile backend — cross-vendor GPU kernels (NVIDIA/AMD)"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# numpy はリファレンス実装・検証層の実行時依存（RNG/noise の再現性のため下限を固定）。
# torch は torch.compile backend 利用時のみの任意依存（ビルド時には要求しない）。
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
# codegen の L2（アセンブル検証）に使うアセンブラは **依存として宣言しない**:
#   - `ptxas` は NVIDIA CUDA Toolkit EULA（proprietary）で Apache-2.0 配布物に
#     引き込むべきでない。開発者が自分の判断で入れる任意ツールとして扱う。
#   - `llvm-mc` は LLVM 同梱の外部バイナリで pip 依存ではない。
# どちらも無ければ codegen は L1-生成のみに落ち、「検証済み」とは言わない。
# 入れ方は docs/CODEGEN.md 参照。

[tool.setuptools.packages.find]
where = ["."]
include = ["tsugi*"]

[tool.ruff]
line-length = 100
